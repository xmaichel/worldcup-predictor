# WCup Predictor — nginx config
# Serves static files and proxies API calls to the Python server

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static files (cached for performance)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=3600";
    }

    # Don't cache HTML (always fresh)
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
